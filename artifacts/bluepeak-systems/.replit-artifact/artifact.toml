kind = "web"
previewPath = "/"
title = "BluePeak Systems"
version = "1.0.0"
id = "artifacts/bluepeak-systems"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22389

[services.development]
run = "pnpm --filter @workspace/bluepeak-systems run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bluepeak-systems", "run", "build" ]
serve = "static"
publicDir = "artifacts/bluepeak-systems/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22389"
BASE_PATH = "/"
